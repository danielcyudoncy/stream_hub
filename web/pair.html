<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreamHub - Pair Device</title>
  <script type="module" src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0b0e14;
      color: #e4e6eb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .container { max-width: 460px; width: 100%; }
    .card {
      background: #151922;
      border: 1px solid #242a38;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
    }
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    h1 { font-size: 22px; font-weight: 700; color: #ffffff; letter-spacing: -0.3px; }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      background: rgba(14, 165, 233, 0.15);
      border: 1px solid rgba(14, 165, 233, 0.3);
      color: #38bdf8;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .subtitle { font-size: 13.5px; color: #8a94a6; margin-bottom: 18px; line-height: 1.45; }
    .code-badge-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0c0f16;
      border: 1px solid #232938;
      border-radius: 12px;
      padding: 10px 16px;
      margin-bottom: 20px;
    }
    .code-badge-label { font-size: 12px; color: #6e7787; text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }
    .code-badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 4px;
      color: #38bdf8;
    }
    
    /* Type Selector Tabs */
    .type-selector-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #94a3b8;
      margin-bottom: 8px;
      display: block;
    }
    .type-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      background: #0c0f16;
      padding: 4px;
      border-radius: 12px;
      border: 1px solid #232938;
      margin-bottom: 16px;
    }
    .type-tab {
      background: transparent;
      border: none;
      color: #8a94a6;
      padding: 9px 4px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }
    .type-tab:hover { color: #ffffff; background: rgba(255, 255, 255, 0.05); }
    .type-tab.active {
      background: #0284c7;
      color: #ffffff;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.4);
    }
    .type-desc {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 18px;
      padding: 0 4px;
    }

    .field-group { margin-bottom: 15px; }
    label {
      display: block;
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .field-hint {
      display: block;
      font-size: 11px;
      color: #64748b;
      margin-top: 4px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      background: #0c0f16;
      border: 1px solid #232938;
      border-radius: 10px;
      color: #f1f5f9;
      font-size: 14.5px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }
    input[type="password"] { font-family: monospace; letter-spacing: 1px; }
    textarea {
      width: 100%;
      padding: 12px 14px;
      background: #0c0f16;
      border: 1px solid #232938;
      border-radius: 10px;
      color: #f1f5f9;
      font-size: 14.5px;
      min-height: 64px;
      resize: vertical;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    textarea:focus {
      outline: none;
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #000000;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 15.5px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
    }
    .btn-submit:hover { opacity: 0.94; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(2, 132, 199, 0.45); }
    .btn-submit:active { transform: translateY(0); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
    .status {
      text-align: center;
      padding: 14px 16px;
      margin-top: 16px;
      border-radius: 10px;
      font-size: 13.5px;
      line-height: 1.5;
      display: none;
    }
    .status.ok { background: rgba(20, 83, 45, 0.6); color: #86efac; border: 1px solid #166534; display: block; }
    .status.err { background: rgba(69, 10, 10, 0.6); color: #fca5a5; border: 1px solid #7f1d1d; display: block; }
    .status.loading { background: rgba(30, 41, 59, 0.6); color: #93c5fd; border: 1px solid #334155; display: block; }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(0,0,0,0.3); border-top-color: #000000; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .required::after { content: " *"; color: #f87171; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header-row">
        <h1>Pair with StreamHub</h1>
        <span class="logo-badge">TV Link</span>
      </div>
      <p class="subtitle">Enter your IPTV provider details below to instantly auto-fill on your TV screen.</p>
      
      <div class="code-badge-wrap">
        <span class="code-badge-label">Pairing Code</span>
        <div id="codeBadge" class="code-badge">------</div>
      </div>

      <div id="typeSelectorArea" style="display: none;">
        <span class="type-selector-label">Provider Type</span>
        <div class="type-tabs">
          <button type="button" class="type-tab" data-type="m3u">M3U</button>
          <button type="button" class="type-tab" data-type="xtream">Xtream</button>
          <button type="button" class="type-tab" data-type="stalker">Stalker</button>
          <button type="button" class="type-tab" data-type="xmltv">XMLTV</button>
        </div>
        <p id="typeDesc" class="type-desc"></p>
      </div>

      <div id="formArea"><p class="subtitle">Connecting to session…</p></div>
      <div id="status" class="status"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';
    import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js';
    import { getFirestore, doc, getDoc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyAS8dc-qi58D9JIDV5qYkXhaViJXAfv79g",
      authDomain: "stream-hub-fecfa.firebaseapp.com",
      projectId: "stream-hub-fecfa",
      storageBucket: "stream-hub-fecfa.firebasestorage.app",
      messagingSenderId: "410364732768",
      appId: "1:410364732768:web:0198ae3ba40b5376a92a05"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const SCHEMAS = {
      m3u: {
        name: 'M3U Playlist',
        description: 'Connect via M3U playlist URL with optional XMLTV guide',
        fields: [
          { key: 'name', label: 'Provider Name', type: 'text', required: true, placeholder: 'e.g. My M3U Service' },
          { key: 'serverUrl', label: 'M3U Playlist URL', type: 'url', required: true, placeholder: 'https://example.com/playlist.m3u' },
          { key: 'xmltvUrl', label: 'XMLTV URL (Optional)', type: 'url', required: false, placeholder: 'https://example.com/epg.xml' },
          { key: 'notes', label: 'Notes (Optional)', type: 'text', required: false, multiline: true, placeholder: 'Optional notes...' }
        ]
      },
      xtream: {
        name: 'Xtream Codes',
        description: 'Connect using your Xtream Codes API server and credentials',
        fields: [
          { key: 'name', label: 'Provider Name', type: 'text', required: true, placeholder: 'e.g. My Xtream Server' },
          { key: 'serverUrl', label: 'Server URL', type: 'url', required: true, placeholder: 'http://domain.com:8080' },
          { key: 'username', label: 'Username', type: 'text', required: true, placeholder: 'Your Xtream username' },
          { key: 'password', label: 'Password', type: 'password', required: true, placeholder: 'Your Xtream password' },
          { key: 'xmltvUrl', label: 'XMLTV URL (Optional)', type: 'url', required: false, placeholder: 'https://example.com/epg.xml' },
          { key: 'notes', label: 'Notes (Optional)', type: 'text', required: false, multiline: true, placeholder: 'Optional notes...' }
        ]
      },
      stalker: {
        name: 'Stalker Portal',
        description: 'Connect to a MAG/Stalker portal using Portal URL and MAC address',
        fields: [
          { key: 'name', label: 'Provider Name', type: 'text', required: true, placeholder: 'e.g. My Stalker Portal' },
          { key: 'serverUrl', label: 'Portal URL', type: 'url', required: true, placeholder: 'http://mag.domain.com/c/' },
          { key: 'macAddress', label: 'MAC Address', type: 'text', required: true, placeholder: '00:1A:79:XX:XX:XX', hint: 'Format: 00:1A:79:XX:XX:XX' },
          { key: 'xmltvUrl', label: 'XMLTV URL (Optional)', type: 'url', required: false, placeholder: 'https://example.com/epg.xml' },
          { key: 'notes', label: 'Notes (Optional)', type: 'text', required: false, multiline: true, placeholder: 'Optional notes...' }
        ]
      },
      xmltv: {
        name: 'XMLTV EPG',
        description: 'Connect a standalone electronic program guide (XMLTV)',
        fields: [
          { key: 'name', label: 'Provider Name', type: 'text', required: true, placeholder: 'e.g. My EPG Guide' },
          { key: 'xmltvUrl', label: 'XMLTV URL', type: 'url', required: true, placeholder: 'https://example.com/epg.xml.gz' },
          { key: 'notes', label: 'Notes (Optional)', type: 'text', required: false, multiline: true, placeholder: 'Optional notes...' }
        ]
      }
    };

    function getQueryParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    const rawCode = getQueryParam('code');
    const code = rawCode ? rawCode.trim().toUpperCase() : null;
    const statusEl = document.getElementById('status');
    const codeBadge = document.getElementById('codeBadge');
    const formArea = document.getElementById('formArea');
    const typeSelectorArea = document.getElementById('typeSelectorArea');
    const typeDesc = document.getElementById('typeDesc');

    let currentSelectedType = 'm3u';
    const formValuesCache = {};

    function showStatus(msg, type = 'ok') {
      statusEl.innerHTML = msg;
      statusEl.className = 'status ' + type;
    }

    function hideStatus() {
      statusEl.className = 'status';
      statusEl.textContent = '';
    }

    function saveCurrentInputs() {
      const schema = SCHEMAS[currentSelectedType];
      if (!schema) return;
      for (const f of schema.fields) {
        const el = document.getElementById(f.key);
        if (el) {
          formValuesCache[f.key] = el.value.trim();
        }
      }
    }

    function buildField(def) {
      const isRequired = !!def.required;
      const label = def.label;
      const cachedVal = formValuesCache[def.key] || '';
      let input;
      if (def.type === 'password') {
        input = `<input type="password" id="${def.key}" value="${escapeHtml(cachedVal)}" placeholder="${def.placeholder || def.label}" ${isRequired ? 'required' : ''} autocomplete="off" />`;
      } else if (def.multiline) {
        input = `<textarea id="${def.key}" placeholder="${def.placeholder || def.label}" ${isRequired ? 'required' : ''}>${escapeHtml(cachedVal)}</textarea>`;
      } else if (def.type === 'url') {
        input = `<input type="url" id="${def.key}" value="${escapeHtml(cachedVal)}" placeholder="${def.placeholder || def.label}" ${isRequired ? 'required' : ''} autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />`;
      } else {
        input = `<input type="text" id="${def.key}" value="${escapeHtml(cachedVal)}" placeholder="${def.placeholder || def.label}" ${isRequired ? 'required' : ''} autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />`;
      }
      const hint = def.hint ? `<span class="field-hint">${def.hint}</span>` : '';
      return `<div class="field-group"><label class="${isRequired ? 'required' : ''}">${label}</label>${input}${hint}</div>`;
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#039;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function renderForm(docRef) {
      const schema = SCHEMAS[currentSelectedType] || SCHEMAS.m3u;
      typeDesc.textContent = schema.description;

      // Update active tab buttons
      document.querySelectorAll('.type-tab').forEach(tab => {
        if (tab.getAttribute('data-type') === currentSelectedType) {
          tab.classList.add('active');
        } else {
          tab.classList.remove('active');
        }
      });

      let html = '';
      for (const def of schema.fields) {
        html += buildField(def);
      }
      html += '<button class="btn-submit" id="submitBtn">Submit to TV</button>';
      formArea.innerHTML = html;

      // Attach submit handler
      document.getElementById('submitBtn').addEventListener('click', async () => {
        saveCurrentInputs();
        const btn = document.getElementById('submitBtn');

        // Validation
        const formData = { providerType: currentSelectedType };
        for (const def of schema.fields) {
          const val = formValuesCache[def.key] || '';
          if (def.required && !val) {
            showStatus('Please fill in required field: ' + def.label, 'err');
            const el = document.getElementById(def.key);
            if (el) el.focus();
            return;
          }
          formData[def.key] = val;
        }

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Sending…';
        try {
          await updateDoc(docRef, {
            formData: formData,
            providerType: currentSelectedType,
            status: 'completed',
            completedAt: new Date()
          });
          showStatus('&#10003; ' + schema.name + ' details sent to your TV! You can return to your TV.', 'ok');
          btn.textContent = 'Sent Successfully!';
        } catch (err) {
          showStatus('Failed to send data: ' + (err.message || err.code || 'Unknown error'), 'err');
          btn.disabled = false;
          btn.textContent = 'Retry Submit';
        }
      });
    }

    async function main() {
      if (!code) {
        codeBadge.textContent = 'No code';
        showStatus('Missing pairing code in URL.', 'err');
        return;
      }
      codeBadge.textContent = code;

      // Gracefully attempt anonymous auth if available, but do not block public access
      try {
        await signInAnonymously(auth);
      } catch (err) {
        console.warn('Anonymous auth unavailable, proceeding in unauthenticated public mode:', err);
      }

      try {
        const docRef = doc(db, 'pairings', code);
        const snap = await getDoc(docRef);
        if (!snap.exists()) {
          showStatus('This pairing code is invalid or has expired.', 'err');
          formArea.innerHTML = '';
          return;
        }
        const data = snap.data();
        if (data.status === 'completed') {
          showStatus('&#10003; This pairing code has already been completed.', 'ok');
          formArea.innerHTML = '';
          return;
        }

        // Set initial type from document if valid
        if (data.providerType && SCHEMAS[data.providerType]) {
          currentSelectedType = data.providerType;
        }

        typeSelectorArea.style.display = 'block';

        // Setup tab switching
        document.querySelectorAll('.type-tab').forEach(tab => {
          tab.addEventListener('click', () => {
            const newType = tab.getAttribute('data-type');
            if (newType && newType !== currentSelectedType) {
              saveCurrentInputs();
              currentSelectedType = newType;
              renderForm(docRef);
            }
          });
        });

        renderForm(docRef);
        hideStatus();

      } catch (err) {
        showStatus('Error reading pairing session: ' + (err.message || err.code || 'Unknown error'), 'err');
      }
    }

    main();
  </script>
</body>
</html>
